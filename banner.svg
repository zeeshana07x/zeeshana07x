<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a1040;#0b3b3a;#0f0c29" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#0b6e5a;#4a1d7a;#302b63" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00a878">
        <animate attributeName="stop-color" values="#00a878;#6a2dc4;#00f5a0;#00a878" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <g fill="#ffffff" opacity="0.10">
      <circle cx="120" cy="60" r="70"><animate attributeName="cy" values="60;90;60" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="170" r="90"><animate attributeName="cy" values="170;140;170" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="40" r="40"><animate attributeName="cx" values="560;600;560" dur="8s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M0 200 Q 225 160 450 200 T 900 200 V240 H0Z" fill="#ffffff" opacity="0.07">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0 200 Q 225 160 450 200 T 900 200 V240 H0Z;M0 200 Q 225 240 450 200 T 900 200 V240 H0Z;M0 200 Q 225 160 450 200 T 900 200 V240 H0Z"/>
    </path>
    <text x="450" y="115" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#txt)" opacity="0">
      Zeeshan
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="450" y="165" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0">
      Full-Stack Developer &amp; Startup Builder
      <animate attributeName="opacity" from="0" to="0.9" begin="0.8s" dur="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
